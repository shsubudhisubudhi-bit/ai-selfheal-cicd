version: "3.8"

services:
  app:
    build: .
    container_name: selfheal-app
    ports:
      - "9090:9090"
    environment:
      - PORT=9090
      - FAIL_MODE=false
      - APP_VERSION=1.0.0
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9090/health"]
      interval: 30s
      timeout: 5s
      retries: 3
